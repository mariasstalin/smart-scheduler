server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 185000

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: appointment
              uri: lb://appointment
              predicates:
                - Path=/appointment/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: smartSchedulerBreaker
                - name: Retry
                  args:
                    retries: 3
                    statuses:
                      - INTERNAL_SERVER_ERROR
                      - SERVICE_UNAVAILABLE
            - id: notification
              uri: lb://notification
              predicates:
                - Path=/notification/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: smartSchedulerBreaker
                - name: Retry
                  args:
                    retries: 3
                    statuses:
                      - INTERNAL_SERVER_ERROR
                      - SERVICE_UNAVAILABLE

# --- RESILIENCE4J CONFIGURATION ---
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 90s
    instances:
      smartSchedulerBreaker:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    gateway:
      access: unrestricted