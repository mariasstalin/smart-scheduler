
# Define a common network for all services
networks:
  smart_scheduler_net:
    driver: bridge

services:
  # -------------------------
  # Databases & Caches (Infrastructure)
  # -------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_scheduler
    ports:
      - "3306:3306"
    volumes:
      - ./db/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      retries: 5
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: root
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"] # Simplified health check
      interval: 10s
      retries: 5
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  # -------------------------
  # Rasa and NLP Services
  # -------------------------
  duckling:
    image: rasa/duckling:latest
    container_name: duckling
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Kolkata # Changed to common standard timezone ID for India
    command: ["duckling-example-exe"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      retries: 5
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  rasa-actions:
    build:
      context: ./rasa/actions
      dockerfile: Dockerfile
    image: smart-scheduler-rasa-actions
    container_name: rasa-actions
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/health"] # Use a standard health endpoint
      interval: 10s
      retries: 5
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  rasa:
    image: rasa/rasa:3.6.21
    container_name: rasa
    volumes:
      - ./rasa:/app
    environment:
      ACTION_ENDPOINT_URL: http://rasa-actions:5055/
      DUCKLING_ENDPOINT_URL: http://duckling:8000/
    command: >
      run --enable-api --cors '*' --model /app/models --debug
    ports:
      - "5005:5005"
    depends_on:
      duckling:
        condition: service_healthy
      rasa-actions:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/status"] # Standard Rasa health check
      interval: 10s
      retries: 5
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  # -------------------------
  # Light GBM
  # -------------------------
  light-gbm:
    build:
      context: ./light-gbm
      dockerfile: Dockerfile
    image: smart-scheduler-light-gbm
    container_name: light-gbm
    ports:
      - "5000:5000"
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:5055/health"] # Use a standard health endpoint
#      interval: 10s
#      retries: 5
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net


  # -------------------------
  # Spring Boot Microservices
  # -------------------------
  discovery:
    build:
      context: .
      dockerfile: discovery/Dockerfile
    image: smart-scheduler-discovery
    container_name: discovery
    ports:
      - "8761:8761"
    profiles: ["prod"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"] # Use actuator health check
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - smart_scheduler_net

  config:
    build:
      context: .
      dockerfile: config/Dockerfile
    image: smart-scheduler-config
    container_name: config
    ports:
      - "8888:8888"
    depends_on:
      discovery:
        condition: service_healthy
    profiles: ["prod"]
    healthcheck:
      # Checks the Spring Boot Actuator health endpoint
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - smart_scheduler_net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    command: http --domain=${NGROK_DOMAIN:-} --authtoken=${NGROK_AUTHTOKEN} gateway:8080
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    profiles: ["prod"]
    networks:
      - smart_scheduler_net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: smart-scheduler-gateway
    container_name: gateway
    ports:
      - "8080:8080"
    depends_on:
      discovery:
        condition: service_healthy
    profiles: ["prod"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - smart_scheduler_net

  appointment:
    build:
      context: .
      dockerfile: appointment/Dockerfile
    image: smart-scheduler-appointment
    container_name: appointment
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery:
        condition: service_healthy
    profiles: ["prod"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - smart_scheduler_net

  notification:
    build:
      context: .
      dockerfile: notification/Dockerfile
    image: smart-scheduler-notification
    container_name: notification
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery:
        condition: service_healthy
    profiles: ["prod"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - smart_scheduler_net

volumes:
  rabbitmq-data:
