
# Define a common network for all services
networks:
  smart_scheduler_net:
    driver: bridge

services:
  # -------------------------
  # Databases & Caches (Infrastructure)
  # -------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_scheduler
    ports:
      - "3306:3306"
    volumes:
      - ./db/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot | grep 'mysqld is alive' > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: root
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping | grep 'Ping succeeded' > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  duckling:
    build:
      context: ./duckling
      dockerfile: Dockerfile
    image: smart-scheduler-duckling
    container_name: duckling
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8000/ | grep -q quack" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: [ "local", "prod" ]
    networks:
      - smart_scheduler_net

    # -------------------------
  # Rasa and NLP Services
  # -------------------------

  rasa-actions:
    build:
      context: ./rasa-actions
      dockerfile: Dockerfile
    image: smart-scheduler-rasa-actions
    container_name: rasa-actions
    ports:
      - "5055:5055"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:5055/health | grep -q 'ok'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: [ "local", "prod" ]
    networks:
      - smart_scheduler_net

  rasa:
    image: rasa/rasa:3.6.21
    container_name: rasa
    volumes:
      - ./rasa:/app
    environment:
      ACTION_ENDPOINT_URL: http://rasa-actions:5055/
      DUCKLING_ENDPOINT_URL: http://duckling:8000/
    command: >
      run --enable-api --cors '*' --model /app/models --debug
    ports:
      - "5005:5005"
    depends_on:
      duckling:
        condition: service_healthy
      rasa-actions:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5005/ | grep 'Hello from Rasa' > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  # -------------------------
  # Light GBM
  # -------------------------
  light-gbm:
    build:
      context: ./light-gbm
      dockerfile: Dockerfile
    image: smart-scheduler-light-gbm
    container_name: light-gbm
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:5000/health | grep -q '\"ok\"' > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: ["local", "prod"]
    networks:
      - smart_scheduler_net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    command: http --domain=${NGROK_DOMAIN:-} --authtoken=${NGROK_AUTHTOKEN} gateway:8080
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    profiles: ["prod"]
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf --max-time 5 http://localhost:4040/api/tunnels | grep '\"public_url\"' > /dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smart_scheduler_net

  # -------------------------
  # Spring Boot Microservices
  # -------------------------
  discovery:
    build:
      context: .
      dockerfile: discovery/Dockerfile
    image: smart-scheduler-discovery
    container_name: discovery
    ports:
      - "8761:8761"
    profiles: ["local", "prod"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8761/actuator/health | grep '\"UP\"' > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smart_scheduler_net

  config:
    build:
      context: .
      dockerfile: config/Dockerfile
    image: smart-scheduler-config
    container_name: config
    ports:
      - "8888:8888"
    env_file:
      - .env
    depends_on:
      discovery:
        condition: service_healthy
    profiles: ["local", "prod"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8888/actuator/health | grep '\"UP\"' > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smart_scheduler_net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: smart-scheduler-gateway
    container_name: gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      discovery:
        condition: service_healthy
    profiles: ["local", "prod"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8080/actuator/health | grep '\"UP\"' > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smart_scheduler_net

  appointment:
    build:
      context: .
      dockerfile: appointment/Dockerfile
    image: smart-scheduler-appointment
    container_name: appointment
    ports:
      - "8082:8082"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      rasa:
        condition: service_healthy
      discovery:
        condition: service_healthy
      config:
        condition: service_healthy
      gateway:
        condition: service_healthy
    profiles: ["prod"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8082/actuator/health | grep '\"UP\"' > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smart_scheduler_net

  notification:
    build:
      context: .
      dockerfile: notification/Dockerfile
    image: smart-scheduler-notification
    container_name: notification
    ports:
      - "8083:8083"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      rasa:
        condition: service_healthy
      light-gbm:
        condition: service_healthy
      discovery:
        condition: service_healthy
      config:
        condition: service_healthy
      gateway:
        condition: service_healthy
      appointment:
        condition: service_healthy
    profiles: ["prod"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8083/actuator/health | grep '\"UP\"' > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smart_scheduler_net

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    image: smart-scheduler-demo
    container_name: demo
    ports:
      - "9999:9999"
    env_file:
      - .env
    depends_on:
      appointment:
        condition: service_healthy
      notification:
        condition: service_healthy
    profiles: [ "prod" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf --max-time 5 http://localhost:9999/actuator/health | grep '\"UP\"' > /dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smart_scheduler_net

volumes:
  rabbitmq-data:
