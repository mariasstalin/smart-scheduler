
eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery:8761/eureka/

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/smart_scheduler
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: root
    password: root
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

message:
  provider: ${NOTIFICATION_MESSAGING_PROVIDER}
  system-phone: ${NOTIFICATION_SYSTEM_PHONE}

ai:
  priority:
    engine:
      url: http://127.0.0.1:5000

rasa:
  url: http://rasa:5005
