
server:
  port: 8083
spring:
  application:
    name: notification

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        retryer:
          period: 1000
          maxPeriod: 5000
          maxAttempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info

application:
  base-url: ${APPLICATION_BASE_URL}}

notification:
  scheduling:
    response-window-minutes: ${NOTIFICATION_SCHEDULING_RESPONSE_WINDOW_MINUTES:3}
    max-consecutive-misses: ${NOTIFICATION_SCHEDULING_MAX_CONSECUTIVE_MISSES:3}
    opt-out-duration: ${NOTIFICATION_SCHEDULING_OPT_OUT_DURATION:PT15M}

  patient:
    priority:
      engine: ${NOTIFICATION_PATIENT_PRIORITY_ENGINE}
      weights:
        is-vip: 0.3
        severity-level: 0.25
        acceptance-rate: 0.25
        time-difference: 0.1
        time-consistency-std-dev: 0.1

