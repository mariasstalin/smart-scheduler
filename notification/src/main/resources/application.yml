
server:
  port: 8083
spring:
  application:
    name: notification

management:
  endpoints:
    web:
      exposure:
        include: health,info

rasa:
  url: http://rasa:5005

notification:
  scheduling:
    response-window-minutes: 3
    max-consecutive-misses: 3
    opt-out-duration: PT15M

  patient:
    priority:
      weights:
        severity-level: 8.0
        visit-count-max-score: 10.0
        visit-count-divisor: 5.0
        high-net-worth: 10.0
        high-profile: 10.0
        response-rate-weight: 20.0
        consecutive-miss-penalty: 5.0
        consecutive-miss-max-penalty: 15.0
