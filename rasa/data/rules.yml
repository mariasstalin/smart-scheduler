version: "3.1"

rules:
  # Rule to activate the Reschedule Form
  - rule: Activate reschedule form
    steps:
      - intent: reschedule_appointment
      - action: reschedule_form
      - active_loop: reschedule_form

  # Rule to submit the Reschedule Form
  - rule: Submit reschedule form
    condition:
      - active_loop: reschedule_form
    steps:
      - action: reschedule_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_reschedule_appointment
      - action: action_listen

  # Rule for Cancelling an appointment (standalone)
  - rule: Activate cancel form
    steps:
      - intent: cancel_appointment
      - action: cancel_form
      - active_loop: cancel_form

  # Rule to submit the Cancel Form
  - rule: Submit cancel form
    condition:
      - active_loop: cancel_form
    steps:
      - action: cancel_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_cancel_appointment
      - action: action_listen

  # --- INTERRUPT RULE (Handles the context switch) ---
  - rule: Allow cancellation to interrupt reschedule form
    condition:
      - active_loop: reschedule_form
    steps:
      - intent: cancel_appointment
      - action: validate_reschedule_form
      - active_loop: null
      - action: cancel_form
      - active_loop: cancel_form

  # Rule to handle Proactive Slot Confirmation
  - rule: Handle proactive slot confirmation
    condition:
      - slot_was_set:
          - temp_new_slot_datetime: _
    steps:
      - or:
          - intent: affirm
          - intent: deny
      - action: action_handle_slot_confirmation
      - action: action_listen