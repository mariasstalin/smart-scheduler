version: "3.1"

rules:
  - rule: Activate appointment form
    steps:
      - intent: ask_appointment
      - action: appointment_form
      - active_loop: appointment_form

  - rule: Submit appointment form
    condition:
      - active_loop: appointment_form
    steps:
      - action: appointment_form
      - active_loop: null
      - action: action_submit_appointment

  - rule: Greet
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Out of scope
    steps:
      - intent: out_of_scope
      - action: utter_form_cancel

  # Extra rules to silence warnings
  - rule: User affirms
    steps:
      - intent: affirm
      - action: utter_greet

  - rule: User informs details
    steps:
      - intent: inform
      - action: utter_greet

  - rule: User asks for change
    steps:
      - intent: ask_change
      - action: utter_form_cancel
