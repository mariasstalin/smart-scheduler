version: "3.1"

rules:
- rule: respond to greeting
  steps:
    - intent: greet
    - action: utter_greet

- rule: respond to goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: handle fallback
  steps:
    - intent: fallback
    - action: utter_fallback

- rule: ask reason for action
  steps:
    - intent: inform
      entities:
        - reason
    - action: utter_ask_reason

- rule: handle confirmation
  steps:
    - intent: confirm_action
    - action: utter_ask_confirmation

- rule: handle no available slots
  steps:
    - intent: ask_available_slots
    - action: utter_no_available_slots
