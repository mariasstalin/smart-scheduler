version: "3.1"

stories:

- story: Book appointment with full details
  steps:
    - intent: ask_appointment
    - action: appointment_form
    - active_loop: appointment_form
    - active_loop: null
    - action: action_submit_appointment

- story: Book appointment missing some details
  steps:
    - intent: ask_appointment
      entities:
        - doctor_name: "Dr. Smith"
        - appointment_date: "tomorrow"
    - action: appointment_form
    - active_loop: appointment_form
    - active_loop: null
    - action: action_submit_appointment

- story: User greets and then books
  steps:
    - intent: greet
    - action: utter_greet
    - intent: ask_appointment
    - action: appointment_form
    - active_loop: appointment_form
    - active_loop: null
    - action: action_submit_appointment

- story: Cancel appointment flow
  steps:
    - intent: ask_appointment
    - action: appointment_form
    - active_loop: appointment_form
    - intent: deny
    - action: utter_form_cancel
    - active_loop: null
