version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hi
      - hello there
      - good morning
      - good day # Added for minimum examples

  - intent: goodbye
    examples: |
      - bye
      - gotta go
      - see you later
      - talk to you soon # Added for minimum examples

  - intent: affirm
    examples: |
      - yes
      - yep
      - sure
      - confirm it
      - that's right # Added for minimum examples

  - intent: deny
    examples: |
      - no
      - nope
      - don't confirm
      - not interested
      - absolutely not # Added for minimum examples

  # FIX 1: Added inform intent and examples to clear 'inform is in domain but not NLU' warning
  - intent: inform
    examples: |
      - The time is [October 20th at 10am]{"entity": "time"}.
      - It's on [next Tuesday]{"entity": "time"}.
      - [4 pm]{"entity": "time"} is when I booked it.
      - I don't know the full details yet.

  # Scenario 1: Proactive flow intent (used by external API)
  # FIX 2: Added more examples for stable training and to clear "only 1 example" warning
  - intent: external_new_slot
    examples: |
      - new slot available
      - external new slot
      - a new time has opened up
      - slot notification

  # Scenario 2: Cancel Appointment
  - intent: cancel_appointment
    examples: |
      - Cancel my appointment [day-after-tomorrow at 3 PM]{"entity": "time"}.
      - I need to cancel my booking for [tomorrow at 5 PM]{"entity": "time"}.
      - Please cancel my [3 PM]{"entity": "time"} appointment.
      - Cancel my booking.
      - Can I cancel my appointment on [next Monday]{"entity": "time"}.

  # Scenario 3: Reschedule Appointment
  - intent: reschedule_appointment
    examples: |
      - Reschedule my [today's appointment]{"entity": "time", "role": "current_time"} to [tomorrow at 6 PM]{"entity": "time", "role": "new_time"}.
      - Change my [10 AM]{"entity": "time", "role": "current_time"} time to [3 PM]{"entity": "time", "role": "new_time"}.
      - Can I move my appointment to [Friday]{"entity": "time", "role": "new_time"}?
      - Reschedule my appointment.
      - I want to move my [Monday]{"entity": "time", "role": "current_time"} appointment.