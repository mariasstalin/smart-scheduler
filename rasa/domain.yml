version: "3.1"

intents:
  - ask_appointment
  - affirm
  - deny
  - inform
  - ask_change

entities:
  - patient_name
  - doctor_name
  - appointment_date
  - appointment_time
  - service
  - phone_number
  - email

slots:
  patient_name:
    type: text
    mappings:
      - type: from_text
  doctor_name:
    type: text
    mappings:
      - type: from_text
  service:
    type: text
    mappings:
      - type: from_text
  appointment_date:
    type: text
    mappings:
      - type: from_entity
        entity: time
  appointment_time:
    type: text
    mappings:
      - type: from_entity
        entity: time
  phone_number:
    type: text
    mappings:
      - type: from_text
  email:
    type: text
    mappings:
      - type: from_text
  requested_slot:
    type: text
    mappings:
      - type: from_text

responses:
  utter_ask_service:
    - text: "Hello! I can help you schedule a clinic appointment. What kind of service or consultation is required? (e.g., cardiology, general checkup)"
  utter_ask_patient_name:
    - text: "Great! Who is the appointment for?"
  utter_ask_doctor_name:
    - text: "Which doctor would you like to see?"
  utter_ask_appointment_date:
    - text: "On which date would you like to schedule the appointment?"
  utter_ask_appointment_time:
    - text: "At what time should we schedule it?"
  utter_ask_phone_number:
    - text: "Can you provide a contact phone number?"
  utter_ask_email:
    - text: "Do you want to provide an email for confirmation? If yes, please enter it, otherwise type 'no'."
  utter_submit_appointment:
    - text: "Your appointment has been successfully booked! Here are the details:\n"
  utter_cancel_appointment:
    - text: "Okay, I've cancelled the appointment process. Let me know if you want to start again."

forms:
  appointment_form:
    required_slots:
      service:
        - type: from_text
      patient_name:
        - type: from_text
      doctor_name:
        - type: from_text
      appointment_date:
        - type: from_entity
          entity: time
      appointment_time:
        - type: from_entity
          entity: time
      phone_number:
        - type: from_text
      email:
        - type: from_text

actions:
  - action_submit_appointment
  - validate_appointment_form
