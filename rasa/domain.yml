version: "3.1"

# --- Intents ---
intents:
  - greet
  - goodbye
  - affirm
  - deny
  - reschedule_appointment
  - cancel_appointment
  - inform
  - external_new_slot # FIX 1: Added missing intent

# --- Entities ---
entities:
  - time

# --- Slots (Bot Memory) ---
slots:
  temp_new_slot_datetime:
    type: any
    influence_conversation: false
    mappings:
      - type: from_trigger_intent
        intent: greet
        value: "placeholder_value"

  cancel_datetime:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: time
        not_intent: reschedule_appointment

  current_datetime:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: time

  new_datetime:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: time


# --- Forms ---
forms:
  cancel_form:
    required_slots:
      - cancel_datetime

  reschedule_form:
    required_slots:
      - current_datetime
      - new_datetime

# --- Actions and Forms ---
actions:
  - action_handle_slot_confirmation
  - action_cancel_appointment
  - action_reschedule_appointment
  - validate_cancel_form
  - validate_reschedule_form

# --- Responses (Templates) ---
responses:
  utter_greet:
    - text: "Hello! How can I help you with your appointments today?"

  utter_goodbye: # FIX 2: Added missing utterance for story use
    - text: "Goodbye! Feel free to reach out if you need anything else."

  utter_confirm_new_slot: # FIX 2: Added missing utterance for story use
    - text: "I see a new slot is available on {temp_new_slot_datetime}. Would you like to confirm this?"

  utter_ask_cancel_datetime:
    - text: "What is the date and time of the appointment you wish to cancel?"

  utter_ask_current_datetime:
    - text: "What is the date and time of the *original* appointment you want to reschedule?"

  utter_ask_new_datetime:
    - text: "What is the *new* date and time you would like to reschedule to?"

  utter_default_confirmation_message:
    - text: "Would you like to confirm the change to {temp_new_slot_datetime}?"