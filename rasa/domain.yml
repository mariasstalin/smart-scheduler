version: '3.1'
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
intents:
- greet
- goodbye
- bot_challenge
- reschedule_appointment
- cancel_appointment
- provide_selection
- affirm
- deny
- provide_datetime
- EXTERNAL_SLOT_OFFER
- confirm_slot_offer
- deny_slot_offer
entities:
- time
slots:
  requested_slot:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: []
  appointment_selection:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: # <--- CRITICAL FIX APPLIED HERE
    - type: from_intent
      intent: provide_selection
      value: "ignored" # This value is ignored; validation action extracts it from payload
      conditions:
      - active_loop: reschedule_form
  appointment_id:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: []
  service:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: []
  datetime:
    type: any
    initial_value: null
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: time
  appointments_list:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: []
  suggested_slots:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: []
  new_slot_datetime:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: []
  old_appointment_id:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: []
  old_service_name:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: [ ]
  slot_offer_id:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: []
  slot_offer_confirmation:
    type: bool
    initial_value: null
    influence_conversation: true
    mappings:
    - type: from_intent
      intent: affirm
      value: true
    - type: from_intent
      intent: confirm_slot_offer
      value: true
    - type: from_intent
      intent: deny
      value: false
    - type: from_intent
      intent: deny_slot_offer
      value: false
  old_appointment_datetime:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: []
  appointment_action_type:
    type: any
    initial_value: null
    influence_conversation: false
    mappings: []
responses:
  utter_greet:
  - text: "Hello! I'm your scheduling assistant. How can I help you today?"
  utter_goodbye:
  - text: "Goodbye! Let me know if you need anything else."
  utter_iamabot:
  - text: "I am a bot, powered by Rasa."
  utter_ask_datetime:
  - text: "What day and time would you like to reschedule your appointment to?"
  utter_ask_slot_confirmation:
  - text: "We have an earlier opening for your {old_service_name} appointment on {new_slot_datetime}. Your original time was {old_appointment_datetime}. Would you prefer to switch to this new slot?"
    buttons:
      - title: "✅ Yes, switch to new time"
        payload: "/confirm_slot_offer"
      - title: "❌ No, keep my original time"
        payload: "/deny_slot_offer"

forms:
  reschedule_form:
    required_slots:
    - appointment_selection 
    - datetime
  slot_offer_confirmation_form:
    required_slots:
    - slot_offer_confirmation
actions:
- action_list_appointments_with_buttons
- utter_goodbye
- action_submit_reschedule_form
- action_set_slot_offer_details
- action_confirm_slot_offer
- action_deny_slot_offer
- action_cancel_appointment
- validate_reschedule_form
- validate_slot_offer_confirmation_form