# config.yml
version: "3.1"
recipe: default.v1

language: "en"

pipeline:
- name: WhitespaceTokenizer
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 50
  batch_size: [8, 32]
  constrain_similarities: true
- name: EntitySynonymMapper
- name: DucklingEntityExtractor
  url: http://localhost:8000
  dimensions: ["time"]
- name: FallbackClassifier
  threshold: 0.7

policies:
- name: RulePolicy
- name: MemoizationPolicy
- name: TEDPolicy
  epochs: 50
  batch_size: [4, 16]
  max_history: 3
  constrain_similarities: true

assistant_id: 20251018-211748-mint-photon