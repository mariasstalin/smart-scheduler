version: "3.1"
language: en

pipeline:
  # Components for efficient NLU
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  # Duckling for robust date/time extraction
  - name: DucklingEntityExtractor
    # IMPORTANT: Replace with your Duckling service URL (e.g., via Docker)
    url: http://localhost:8000
    dimensions: ["time"]
  # Main classification and entity extraction model
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100

policies:
  - name: RulePolicy
  - name: TEDPolicy
    max_history: 5
    epochs: 100
# Removed FallbackClassifier

assistant_id: 20251013-smart-scheduler